
name: WorkFly Tailscale RDP

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_HOSTNAME: workfly-rdp
      RDP_USER: WorkFly
      RUNTIME_MINUTES: 330

    steps:
      - name: Clean Desktop
        run: |
          $desktop = [Environment]::GetFolderPath("Desktop")

          Get-ChildItem $desktop -Filter "*.lnk" -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TS_AUTHKEY secret is missing."
          }

          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          & $tailscale up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=$env:TS_HOSTNAME" `
            "--accept-dns=false" `
            "--unattended=true"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (!$ip) {
            throw "Could not get Tailscale IP."
          }

          "TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $ip"

      - name: Create RDP User And Password
        run: |
          $user = $env:RDP_USER

          $alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+="

          $bytes = New-Object byte[] 28
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)

          $password = -join ($bytes | ForEach-Object {
            $alphabet[[int]($_ % $alphabet.Length)]
          })

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $user -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $user -Password $securePassword -PasswordNeverExpires $true
            Enable-LocalUser -Name $user
          }
          else {
            New-LocalUser `
              -Name $user `
              -Password $securePassword `
              -FullName "WorkFly RDP User" `
              -Description "WorkFly Remote Desktop Account" `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"

          Add-LocalGroupMember `
            -Group $rdpGroup.Name `
            -Member $user `
            -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

          Write-Host "RDP user created successfully."

      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Remote Desktop enabled."

      - name: Install Opera GX
        run: |
          winget install `
            --id Opera.OperaGX `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
            throw "Opera GX installation failed."
          }

          $possiblePaths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX\launcher.exe",
            "$env:ProgramFiles\Opera GX\launcher.exe",
            "${env:ProgramFiles(x86)}\Opera GX\launcher.exe"
          )

          $opera = $possiblePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if ($opera) {
            $desktop = [Environment]::GetFolderPath("Desktop")
            $shortcut = Join-Path $desktop "Opera GX.lnk"

            $shell = New-Object -ComObject WScript.Shell
            $link = $shell.CreateShortcut($shortcut)
            $link.TargetPath = $opera
            $link.Save()
          }

          Write-Host "Opera GX installation completed."

      - name: Show Connection Information
        run: |
          $ip = $env:TAILSCALE_IP
          $user = $env:RDP_USER
          $password = $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "===================================="
          Write-Host "       WORKFLY RDP INFORMATION"
          Write-Host "===================================="
          Write-Host "RDP Address : $ip"
          Write-Host "Username    : .\$user"
          Write-Host "Password    : $password"
          Write-Host "===================================="

          @"
          # WorkFly RDP Connection

          - **Address:** $ip
          - **Username:** `.\$user`
          - **Password:** `$password`

          Connect using Windows App and your Tailscale connection.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Keep Runner Alive
        run: |
          $runtime = [int]$env:RUNTIME_MINUTES
          $elapsed = 0

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "WorkFly is running for $runtime minutes."

          while ($elapsed -lt ($runtime * 60)) {
            Start-Sleep -Seconds 300
            $elapsed += 300

            $rdp = Get-Service TermService

            if ($rdp.Status -ne "Running") {
              Start-Service TermService
            }

            $ts = Get-Service Tailscale -ErrorAction SilentlyContinue

            if ($ts -and $ts.Status -ne "Running") {
              Start-Service Tailscale
            }

            Write-Host "WorkFly running: $elapsed seconds."

            & $tailscale status
          }

          Write-Host "WorkFly runtime completed."
